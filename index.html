<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Orvix Central Hub</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" sizes="64x64">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #050D17; --card: #0F1D2E; --card-2: #13253A; --edge: #1C3048; --edge-2: #2A4562;
    --ink: #F2F6FA; --ink-2: #A3B6C8; --ink-3: #6F879B;
    --orange: #F76E19; --orange-2: #FF8A3D; --navy: #06101C;
    --green: #2DB46E; --amber: #E8B04A; --red: #E5484D; --blue: #4F8FE0; --violet: #9A7BF0;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif; --text: "Barlow", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--night); color: var(--ink); font: 16px/1.5 var(--text); }
  body { min-height: 100vh; background: radial-gradient(1200px 600px at 80% -10%, rgba(247,110,25,.10), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgba(79,143,224,.08), transparent 60%), var(--night); }
  a { color: var(--orange-2); }
  button, input, select, textarea { font: inherit; color: inherit; }
  h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; margin: 0; }
  .hidden { display: none !important; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

  /* Sign in */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .login-card { width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--edge); border-radius: 18px; padding: 32px 28px; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .brand img { width: 44px; height: 44px; object-fit: contain; }
  .brand b { font-family: var(--display); font-size: 26px; display: block; line-height: 1; }
  .brand span { color: var(--ink-3); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
  .login-logo { display: flex; justify-content: center; margin: 4px 0 28px; }
  .hub-logo { display: flex; align-items: center; gap: 14px; }
  .hub-logo .ring { width: 64px; height: 64px; flex: none; }
  .hub-logo .word { display: flex; flex-direction: column; }
  .hub-logo .word b { font-family: "Orbitron", var(--display); font-weight: 800; font-size: 38px; line-height: 1; letter-spacing: .04em; color: var(--ink); }
  .hub-logo .word span { font-family: "Orbitron", var(--display); font-weight: 600; font-size: 11px; letter-spacing: .66em; color: var(--ink-2); margin-top: 8px; white-space: nowrap; }
  .ring.mark { width: 30px; height: 30px; flex: none; }
  .forgot { display: block; margin: 16px auto 0; background: none; border: 0; color: var(--ink-2); font-size: 14px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .forgot:hover { color: var(--ink); }
  .links { display: flex; justify-content: center; gap: 22px; margin-top: 16px; }
  .links .forgot { margin: 0; }
  .ok { color: var(--green); font-size: 14px; margin-top: 12px; }
  label { display: block; font-size: 13px; color: var(--ink-2); margin: 14px 0 6px; }
  input[type=email], input[type=password], input[type=text], textarea, select {
    width: 100%; background: var(--navy); border: 1px solid var(--edge); border-radius: 10px; padding: 11px 12px; outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--orange); }
  .btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 10px; padding: 11px 18px; cursor: pointer; font-weight: 600; }
  .btn-primary { background: var(--orange); color: var(--navy); }
  .btn-primary:hover { background: var(--orange-2); }
  .btn-ghost { background: transparent; border: 1px solid var(--edge-2); color: var(--ink); }
  .btn-ghost:hover { border-color: var(--ink-3); }
  .btn-small { padding: 6px 12px; font-size: 14px; border-radius: 8px; }
  .btn-danger { background: transparent; border: 1px solid rgba(229,72,77,.5); color: #FF8A8D; }
  .btn:disabled { opacity: .55; cursor: default; }
  .full { width: 100%; }
  .err { color: #FF8A8D; font-size: 14px; margin-top: 12px; min-height: 1em; }
  .muted { color: var(--ink-3); font-size: 14px; }

  /* Shell */
  #app { display: flex; min-height: 100vh; }
  .side { width: 248px; flex: none; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; background: rgba(8,19,31,.92); border-right: 1px solid var(--edge); padding: 22px 14px 16px; z-index: 30; }
  .side-brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 22px; cursor: pointer; }
  .side-brand .ring.mark { width: 40px; height: 40px; }
  .sb-word b { display: block; font-family: "Orbitron", var(--display); font-weight: 800; font-size: 21px; line-height: 1; letter-spacing: .04em; }
  .sb-word span { display: block; font-family: "Orbitron", var(--display); font-weight: 600; font-size: 7.5px; letter-spacing: .55em; color: var(--ink-2); margin-top: 5px; white-space: nowrap; }
  nav { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
  .nav { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; color: var(--ink-2); text-decoration: none; font-weight: 500; position: relative; }
  .nav:hover { background: var(--glass, rgba(170,196,220,.06)); color: var(--ink); }
  .nav.on { background: linear-gradient(90deg, rgba(247,110,25,.22), rgba(247,110,25,.04)); color: var(--ink); }
  .nav.on::before { content: ""; position: absolute; left: -14px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--orange); }
  .nav.on .ni { color: var(--orange); }
  .nav .ni { width: 20px; height: 20px; flex: none; }
  .nav em { margin-left: auto; font-style: normal; font-size: 12px; font-weight: 600; background: var(--orange); color: var(--navy); border-radius: 999px; padding: 0 7px; }
  .nav em:empty { display: none; }
  .nav.sub { padding-left: 22px; }
  .nav-group { display: flex; align-items: center; gap: 10px; padding: 16px 12px 6px; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  .nav-group img { width: 20px; height: 20px; border-radius: 5px; }
  .nav-sep { height: 1px; background: var(--edge); margin: 14px 8px; }
  .side-foot { border-top: 1px solid var(--edge); padding-top: 14px; display: grid; gap: 12px; }
  .me { display: flex; align-items: center; gap: 10px; padding: 0 4px; min-width: 0; }
  .av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--card-2); border: 1px solid var(--edge-2); font-weight: 600; flex: none; }
  .me-t { min-width: 0; }
  .me-t b { display: block; font-weight: 500; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .me-t span { color: var(--ink-3); font-size: 13px; }
  .mainwrap { flex: 1; min-width: 0; }
  header.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 28px; background: rgba(5,13,23,.85); backdrop-filter: blur(10px); border-bottom: 1px solid var(--edge); }
  .menu { display: none; background: none; border: 0; color: var(--ink); cursor: pointer; padding: 6px; margin-left: -6px; }
  .scrim { display: none; }
  .crumb { color: var(--ink-3); font-size: 15px; }
  .crumb b { color: var(--ink); font-weight: 500; }
  .crumb i { font-style: normal; margin: 0 8px; }
  .spacer { flex: 1; }
  main { padding: 30px 28px 64px; max-width: 1280px; }
  .btn { white-space: nowrap; }
  .page-title { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
  .page-title h1 { font-size: 38px; line-height: 1.05; }
  .page-title .muted { font-size: 16px; margin-top: 4px; }

  /* Overview */
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 28px; }
  .tile { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--edge); border-radius: 14px; padding: 18px; min-width: 0; text-decoration: none; color: inherit; }
  a.tile:hover { border-color: var(--edge-2); }
  .tile .ti { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--card-2); flex: none; color: var(--c, var(--blue)); }
  .tile .ti svg { width: 22px; height: 22px; }
  .tile .tl { color: var(--ink-2); font-size: 14px; }
  .tile .tv { font-family: var(--display); font-size: 32px; font-weight: 600; line-height: 1.1; }
  .tile .ts { color: var(--ink-3); font-size: 13px; }
  .sec { display: flex; align-items: center; justify-content: space-between; margin: 0 0 12px; }
  .sec h2 { font-size: 24px; }
  .products { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 28px; }
  .prod { position: relative; background: var(--card); border: 1px solid var(--edge); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
  .prod-top { position: relative; padding: 22px; display: flex; gap: 18px; align-items: flex-start; flex: 1; }
  .prod-top::after { content: ""; position: absolute; right: -60px; top: -60px; width: 260px; height: 260px; border-radius: 50%; background: var(--glow); opacity: .12; filter: blur(40px); pointer-events: none; }
  .prod .app-icon { width: 84px; height: 84px; border-radius: 19px; }
  .prod h3 { font-size: 26px; }
  .prod .tag2 { color: var(--ink-2); margin: 2px 0 10px; }
  .pillst { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 3px 11px; background: rgba(45,180,110,.12); color: #5ED79A; border: 1px solid rgba(45,180,110,.3); }
  .pillst::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pillst.off { background: rgba(163,182,200,.08); color: var(--ink-2); border-color: var(--edge); }
  .pillst.bad { background: rgba(229,72,77,.12); color: #FF8A8D; border-color: rgba(229,72,77,.35); }
  .pillst.wait { background: rgba(163,182,200,.08); color: var(--ink-3); border-color: var(--edge); }
  .prod-desc { color: var(--ink-2); font-size: 15px; margin-top: 12px; }
  .prod-foot { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; padding: 16px 22px; border-top: 1px solid var(--edge); }
  .stat span { display: block; color: var(--ink-3); font-size: 13px; }
  .stat b { font-family: var(--display); font-size: 24px; font-weight: 600; }
  .prod-foot .acts { margin-left: auto; display: flex; gap: 8px; }
  .lower { display: grid; grid-template-columns: 1.25fr 1fr .85fr; gap: 16px; }
  .chart-wrap { position: relative; }
  .chart-wrap svg { width: 100%; height: 210px; display: block; }
  .tip { position: absolute; pointer-events: none; background: var(--card-2); border: 1px solid var(--edge-2); border-radius: 8px; padding: 6px 10px; font-size: 13px; white-space: nowrap; transform: translate(-50%, -110%); }
  .tip b { font-weight: 600; }
  .act { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--edge); min-width: 0; }
  .act:first-child { border-top: 0; }
  .act .ai { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--card-2); color: var(--c); flex: none; }
  .act .ai svg { width: 18px; height: 18px; }
  .act .at { flex: 1; min-width: 0; }
  .act .at b { display: block; font-weight: 500; font-size: 14px; }
  .act .at span { display: block; color: var(--ink-3); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .act time { color: var(--ink-3); font-size: 12px; white-space: nowrap; }
  .hrow { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--edge); }
  .hrow:first-child { border-top: 0; }
  .hrow .hn { flex: 1; min-width: 0; }
  .hrow .hn b { display: block; font-weight: 500; font-size: 14px; }
  .hrow .hn span { color: var(--ink-3); font-size: 12px; }
  .hs { font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--ink-3); }
  .hs::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .hs.ok { color: #5ED79A; } .hs.bad { color: #FF8A8D; }
  .note { color: var(--ink-3); font-size: 13px; margin-top: 10px; }

  /* Tabs */
  .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--edge); margin-bottom: 22px; overflow-x: auto; }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; color: var(--ink-2); cursor: pointer; font-weight: 600; white-space: nowrap; }
  .tab.on { color: var(--ink); border-color: var(--orange); }
  .tab .n { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: var(--card-2); font-size: 12px; color: var(--ink-2); }

  /* Filters */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; align-items: center; }
  .pill { background: var(--card); border: 1px solid var(--edge); color: var(--ink-2); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 14px; }
  .pill.on { background: var(--ink); color: var(--navy); border-color: var(--ink); }
  .filters input[type=text] { max-width: 260px; padding: 7px 12px; border-radius: 999px; }

  /* Reports */
  .reports { display: grid; gap: 12px; }
  .report { background: var(--card); border: 1px solid var(--edge); border-radius: 14px; padding: 18px; }
  .report-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 10px; }
  .tag { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; border-radius: 6px; padding: 2px 8px; }
  .tag.bug { background: rgba(229,72,77,.14); color: #FF8A8D; }
  .tag.idea { background: rgba(154,123,240,.15); color: #C3B0FF; }
  .tag.other { background: rgba(163,182,200,.12); color: var(--ink-2); }
  .status { font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--ink-3)); }
  .report .msg { white-space: pre-wrap; word-break: break-word; margin: 0 0 12px; }
  .meta { color: var(--ink-3); font-size: 13px; }
  .shots { display: flex; gap: 10px; flex-wrap: wrap; margin: 4px 0 14px; }
  .shots a { display: block; width: 92px; height: 140px; border-radius: 10px; overflow: hidden; border: 1px solid var(--edge); background: var(--navy); }
  .shots img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .reply-row { display: grid; grid-template-columns: 220px 1fr auto; grid-template-areas: "rp rp rp" "st . sv"; gap: 12px; align-items: center; border-top: 1px solid var(--edge); padding-top: 16px; }
  .reply-row textarea { grid-area: rp; min-height: 130px; resize: vertical; font-size: 16px; line-height: 1.55; padding: 14px 16px; overflow: hidden; }
  .reply-row .st { grid-area: st; }
  .reply-row .sv { grid-area: sv; padding: 10px 22px; font-size: 15px; }
  .reply-label { grid-area: rp; display: none; }
  .report .msg { font-size: 17px; }
  .saved { color: var(--green); font-size: 13px; align-self: center; }
  .empty { text-align: center; color: var(--ink-3); padding: 48px 16px; background: var(--card); border: 1px dashed var(--edge); border-radius: 14px; }

  /* People */
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 18px; }
  .panel { background: var(--card); border: 1px solid var(--edge); border-radius: 16px; padding: 20px; min-width: 0; }
  .panel h3 { font-size: 22px; display: flex; align-items: center; gap: 10px; }
  .panel .sub { color: var(--ink-3); font-size: 14px; margin: 2px 0 14px; }
  .count { font-family: var(--text); font-size: 13px; font-weight: 600; color: var(--ink-2); background: var(--card-2); border-radius: 999px; padding: 1px 9px; }
  .progress { height: 6px; background: var(--navy); border-radius: 999px; overflow: hidden; margin: 6px 0 14px; }
  .progress i { display: block; height: 100%; background: var(--green); border-radius: 999px; }
  .rows { display: grid; }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--edge); }
  .row:first-child { border-top: 0; }
  .row .main { flex: 1; min-width: 0; }
  .row .main b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .main span { color: var(--ink-3); font-size: 13px; }
  .add { display: flex; gap: 8px; margin-top: 14px; }
  .add input { flex: 1; min-width: 0; padding: 8px 12px; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
  .toggle input { accent-color: var(--green); width: 16px; height: 16px; }
  .badge { font-size: 12px; color: var(--ink-3); border: 1px solid var(--edge); border-radius: 6px; padding: 1px 6px; white-space: nowrap; }

  .soon { background: var(--card); border: 1px solid var(--edge); border-radius: 18px; padding: 40px 28px; text-align: center; }
  .soon h2 { font-size: 28px; margin-bottom: 6px; }
  .soon p { color: var(--ink-2); max-width: 520px; margin: 0 auto 18px; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--card-2); border: 1px solid var(--edge-2); border-radius: 10px; padding: 10px 16px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }

  @media (max-width: 1180px) {
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .lower { grid-template-columns: 1fr 1fr; }
    .lower > :first-child { grid-column: 1 / -1; }
  }
  @media (max-width: 900px) {
    .side { position: fixed; left: 0; top: 0; transform: translateX(-100%); transition: transform .2s; }
    #app.open .side { transform: none; }
    #app.open .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 25; }
    .menu { display: block; }
    header.top { padding: 0 16px; }
    main { padding: 22px 16px 48px; }
    .products, .lower { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    .grid2 { grid-template-columns: 1fr; }
    .reply-row { grid-template-columns: 1fr auto; grid-template-areas: "rp rp" "st sv"; }
    .tiles { grid-template-columns: 1fr 1fr; gap: 10px; }
    .tile { padding: 14px; gap: 10px; }
    .tile .ti { display: none; }
    .tile .tv { font-size: 26px; }
    .page-title h1 { font-size: 30px; }
    .prod-top { padding: 18px; gap: 14px; }
    .prod .app-icon { width: 64px; height: 64px; border-radius: 15px; }
    .prod-foot { padding: 14px 18px; gap: 16px; }
    .prod-foot .acts { margin-left: 0; width: 100%; }
    .prod-foot .acts .btn { flex: 1; }
  }
</style>
</head>
<body>

<!-- Sign in: the only thing anyone sees until they're a confirmed admin. -->
<section id="login" class="hidden">
  <div class="login-card">
    <div class="login-logo"><div class="hub-logo" role="img" aria-label="Orvix Central Hub"><svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="33" fill="none" stroke="#F76E19" stroke-width="26" stroke-dasharray="63.1 6" transform="rotate(155.2 50 50)"/></svg><div class="word"><b>ORVIX</b><span>CENTRAL HUB</span></div></div></div>
    <form id="login-form">
      <label for="email" style="margin-top:0">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <div id="pw-again" class="hidden">
        <label for="password2">Type it again</label>
        <input id="password2" type="password" autocomplete="new-password">
        <div class="muted" style="margin-top:8px;font-size:13px">At least 10 characters.</div>
      </div>
      <button class="btn btn-primary full" style="margin-top:20px" type="submit" id="login-btn">Sign in</button>
    </form>
    <div class="err" id="login-err"></div>
    <div class="links">
      <button type="button" class="forgot" id="forgot">Forgot password?</button>
      <button type="button" class="forgot" id="mode">Create account</button>
    </div>
  </div>
</section>

<!-- First sign-in with a temporary password: pick your own before anything else. -->
<section id="pw" class="hidden" style="min-height:100vh;display:grid;place-items:center;padding:24px 16px">
  <div class="login-card">
    <div class="login-logo"><div class="hub-logo" role="img" aria-label="Orvix Central Hub"><svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="33" fill="none" stroke="#F76E19" stroke-width="26" stroke-dasharray="63.1 6" transform="rotate(155.2 50 50)"/></svg><div class="word"><b>ORVIX</b><span>CENTRAL HUB</span></div></div></div>
    <h2 id="pw-title" style="font-size:24px;margin:0 0 6px">Choose your password</h2>
    <p class="muted" id="pw-sub" style="margin:0 0 6px">You signed in with a temporary password. Pick your own to continue.</p>
    <form id="pw-form">
      <label for="pw1">New password</label>
      <input id="pw1" type="password" autocomplete="new-password" minlength="10" required>

async function check() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  const { data: admin, error } = await sb.rpc('is_admin');
  if (error || !admin) {
    await sb.auth.signOut();
    return showLogin('This account isn’t an admin.');
  }
  me = session.user;
  $('#login').classList.add('hidden');
  const { data: mine } = await sb.rpc('hub_me');
  if (mine?.must_change_password) return showPw(false);
  $('#pw').classList.add('hidden');

  $('#who').textContent = me.email;
  $('#av').textContent = (me.email || '?')[0].toUpperCase();

}

  me = null; cache = { feedback: null, people: null, overview: null, grid: null };

  $('#login-btn').textContent = c ? 'Create account' : 'Sign in';
  $('#forgot').classList.toggle('hidden', c);
  $('#mode').textContent = c ? 'Back to sign in' : 'Create account';
  $('#login-err').className = 'err'; $('#login-err').textContent = '';
}
$('#mode').addEventListener('click', () => setMode(!creating));
async function createAccount() {
  const email = $('#email').value.trim().toLowerCase(), pw = $('#password').value, err = $('#login-err');
  const say = (msg, ok) => { err.className = ok ? 'ok' : 'err'; err.textContent = msg; };
  if (pw !== $('#password2').value) return say('The two passwords don’t match.');
  if (pw.length < 10) return say('Use at least 10 characters.');
  const { data: allowed, error: e1 } = await sb.rpc('hub_can_register', { p_email: email });
  if (e1) return say(e1.message);
  if (!allowed) return say('This email isn’t set up for the hub. Ask an admin to add it first.');
  const { data, error } = await sb.auth.signUp({ email, password: pw, options: { emailRedirectTo: location.origin + '/', data: { hub_signup: true } } });
  if (error) return say(error.message);
  $('#password').value = $('#password2').value = '';
  if (data.session) return check();
  // Supabase answers the same way for an email that already has an account.
  setMode(false);
  say('Check your email for a link to confirm the account, then sign in here. If you already had an Orvix Aero account, sign in with that password or use “Forgot password?”.', true);
}

$('#login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (creating) {
    const b = $('#login-btn'); b.disabled = true;
    try { await createAccount(); } finally { b.disabled = false; }
    return;
  }
  const b = $('#login-btn'); b.disabled = true; $('#login-err').className = 'err'; $('#login-err').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#password').value });
  b.disabled = false;
  if (error) { $('#login-err').textContent = error.message; return; }
  $('#password').value = '';
  check();
});
$('#pw-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const a = $('#pw1').value, b2 = $('#pw2').value, err = $('#pw-err');
  err.textContent = '';
  if (a !== b2) { err.textContent = 'The two passwords don’t match.'; return; }
  if (a.length < 10) { err.textContent = 'Use at least 10 characters.'; return; }
  const b = $('#pw-btn'); b.disabled = true;
  const { error } = await sb.auth.updateUser({ password: a });
  if (error) { b.disabled = false; err.textContent = error.message; return; }
  const { error: e2 } = await sb.rpc('hub_password_changed');
  b.disabled = false;
  if (e2) { err.textContent = e2.message; return; }
  $('#pw1').value = $('#pw2').value = '';
  toast('Password saved');
  check();
});
$('#forgot').addEventListener('click', async () => {
  const email = $('#email').value.trim(), err = $('#login-err');
  if (!email) { err.className = 'err'; err.textContent = 'Type your email above, then tap “Forgot password?” again.'; $('#email').focus(); return; }
  const b = $('#forgot'); b.disabled = true;
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + '/' });
  b.disabled = false;
  // Same answer whether or not the email has an account.
  err.className = error ? 'err' : 'ok';
  err.textContent = error ? error.message : 'If that email has an account, a reset link is on its way. Open it in this browser.';
});

const SB_URL = 'https://uxnjglagrrprnsliyaed.supabase.co';
const SB_KEY = 'sb_publishable_8vrxn8kJD8_lXdJ-a6_eqg_EtHNC4B8';

];
async function health() {
  if (health.last && Date.now() - health.last.at < 60000) return health.last.results;
  const results = await Promise.all(CHECKS.map(async ([id, name, sub, icon, fn]) => {
    const t = performance.now();
    try { await fn(); return { id, name, sub, icon, ok: true, ms: Math.round(performance.now() - t) }; }
    catch (e) { return { id, name, sub, icon, ok: false, why: e?.message || 'Not responding' }; }
  }));

}

// One series, bars, hover tooltip. Days run left (oldest) to right (today).
let chartRows = null;
window.addEventListener('resize', () => { const el = $('#chart'); if (el && chartRows) drawChart(el, chartRows); });
function drawChart(el, rows) {
  chartRows = rows;
  const W = Math.max(280, el.clientWidth || 640), H = 210, L = 30, B = 26, T = 10, max = Math.max(4, ...rows.map((r) => r.signups));
  const step = Math.ceil(max / 4), top = step * 4, n = rows.length, bw = (W - L) / n;
  const y = (v) => T + (H - T - B) * (1 - v / top);
  const fmt = (d) => new Date(d + 'T12:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  let g = '';
  for (let i = 0; i <= 4; i++) g += `<line x1="${L}" x2="${W}" y1="${y(i * step)}" y2="${y(i * step)}" stroke="#1C3048" stroke-width="1"/><text x="${L - 8}" y="${y(i * step) + 4}" fill="#6F879B" font-size="11" text-anchor="end">${i * step}</text>`;
  const bars = rows.map((r, i) => {
    const x = L + i * bw + bw * 0.18, w = bw * 0.64, h = y(0) - y(r.signups);
    const every = W < 480 ? 3 : 2, lbl = (n - 1 - i) % every ? '' : `<text x="${i === n - 1 ? W - 2 : x + w / 2}" y="${H - 8}" fill="#6F879B" font-size="11" text-anchor="${i === n - 1 ? 'end' : 'middle'}">${fmt(r.day)}</text>`;
    return `<g data-i="${i}"><rect x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}" fill="transparent"/>${r.signups ? `<path d="M${x},${y(0)} V${y(r.signups) + 4} q0,-4 4,-4 h${w - 8} q4,0 4,4 V${y(0)} z" fill="#4F8FE0"/>` : ''}${lbl}</g>`;
  }).join('');
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="New accounts per day">${g}${bars}</svg><div class="tip hidden"></div>`;
  const tip = $('.tip', el), svg = $('svg', el);
  svg.addEventListener('mousemove', (e) => {
    const gEl = e.target.closest('g[data-i]'); if (!gEl) return tip.classList.add('hidden');
    const r = rows[+gEl.dataset.i], box = svg.getBoundingClientRect(), i = +gEl.dataset.i;
    tip.innerHTML = `<b>${r.signups}</b> new account${r.signups === 1 ? '' : 's'} · ${r.reports} report${r.reports === 1 ? '' : 's'}<br><span class="muted">${fmt(r.day)}</span>`;
    tip.style.left = ((L + (i + 0.5) * bw) / W * box.width) + 'px';
    tip.style.top = (y(r.signups) / H * box.height) + 'px';
    tip.classList.remove('hidden');
  });
  svg.addEventListener('mouseleave', () => tip.classList.add('hidden'));
}

async function healthPage() {
  crumb('<b>System health</b>'); setNav('health');
  $('#view').innerHTML = `<div class="page-title"><div><h1>System health</h1><div class="muted">Live checks from this browser, refreshed when you open this page.</div></div></div>
    <section class="panel" style="max-width:720px"><div id="hl"><div class="muted">Checking…</div></div>
    <div class="note">Uptime history needs a monitoring service; these are live checks only.</div></section>`;
  health.last = null;
  const rs = await health();
  $('#hl').innerHTML = rs.map((r) => `<div class="hrow"><span style="color:var(--ink-2);width:20px;height:20px;display:inline-flex">${r.icon}</span>
    <div class="hn"><b>${esc(r.name)}</b><span>${esc(r.sub)}${r.ok ? ` · ${r.ms} ms` : ` · ${esc(r.why)}`}</span></div>
    <span class="hs ${r.ok ? 'ok' : 'bad'}">${r.ok ? 'Healthy' : 'Problem'}</span></div>`).join('');
}

function failMsg(e) {
  const m = e?.message || String(e);
  return /hub_|function|schema cache/i.test(m) ? 'Database update not applied yet' : m;
}

// ---------- Data ----------
async function loadFeedback(force) {
  if (cache.feedback && !force) return cache.feedback;
  const { data, error } = await sb.rpc('hub_feedback', { p_limit: 500 });
  if (error) throw error;
  return (cache.feedback = data);
}
async function loadPeople(force) {
  if (cache.people && !force) return cache.people;
  const { data, error } = await sb.rpc('hub_people');
  if (error) throw error;
  return (cache.people = data);
}

// ---------- Orvix Aero ----------
let bugFilter = { show: 'open', kind: 'all', q: '' };
async function aero(tab) {
  crumb('<span>Orvix Aero</span><i>/</i><b>' + (tab === 'people' ? 'Testers &amp; admins' : 'Bug reports') + '</b>'); setNav(tab === 'people' ? 'people' : 'bugs');
  $('#view').innerHTML = `
    <div class="page-title"><div style="display:flex;align-items:center;gap:14px"><img class="app-icon" src="icon-aero.png" alt="" style="width:52px;height:52px;border-radius:12px"><h1>Orvix Aero</h1></div></div>
    <div class="tabs">
      <button class="tab ${tab === 'bugs' ? 'on' : ''}" data-go="#/aero/bugs">Bug reports <span class="n" id="n-bugs">·</span></button>
      <button class="tab ${tab === 'people' ? 'on' : ''}" data-go="#/aero/people">Testers &amp; admins</button>
    </div>
    <div id="pane"><div class="muted">Loading…</div></div>`;
  try {
    const f = await loadFeedback();
    $('#n-bugs').textContent = f.filter((r) => OPEN.has(r.status)).length;
    $('#nav-bugs').textContent = f.filter((r) => r.kind === 'bug' && OPEN.has(r.status)).length || '';
    if (tab === 'people') return people(await loadPeople());
    bugs(f);
  } catch (e) { $('#pane').innerHTML = `<div class="empty">${esc(failMsg(e))}</div>`; }
}

function bugs(all) {
  const pane = $('#pane');
  const pills = (key, opts) => opts.map(([v, l]) => `<button class="pill ${bugFilter[key] === v ? 'on' : ''}" data-f="${key}" data-v="${v}">${l}</button>`).join('');
  const q = bugFilter.q.toLowerCase();
  const list = all.filter((r) =>
    (bugFilter.show === 'all' || (bugFilter.show === 'open' ? OPEN.has(r.status) : !OPEN.has(r.status))) &&
    (bugFilter.kind === 'all' || r.kind === bugFilter.kind) &&
    (!q || `${r.message} ${r.email} ${r.reply} ${r.id}`.toLowerCase().includes(q)));
  pane.innerHTML = `
    <div class="filters">
      ${pills('show', [['open', 'Open'], ['closed', 'Closed'], ['all', 'All']])}
      <span style="width:8px"></span>
      ${pills('kind', [['all', 'Everything'], ['bug', 'Bugs'], ['idea', 'Ideas'], ['other', 'Other']])}
      <span class="spacer"></span>
      <input type="text" id="q" placeholder="Search reports" value="${esc(bugFilter.q)}">
    </div>
    <div class="reports">${list.length ? list.map(reportCard).join('') : '<div class="empty">Nothing here. Nice.</div>'}</div>`;
  pane.querySelectorAll('[data-f]').forEach((b) => b.onclick = () => { bugFilter[b.dataset.f] = b.dataset.v; bugs(all); });
  const qi = $('#q'); qi.oninput = () => { bugFilter.q = qi.value; clearTimeout(bugs.t); bugs.t = setTimeout(() => { bugs(all); const n = $('#q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
  pane.querySelectorAll('.report').forEach(wireReport);
  loadShots(pane);
}

function reportCard(r) {
  const [, label, color] = statusOf(r.status);
  const shots = (r.screenshots || []).map((p) => `<a target="_blank" rel="noopener" data-shot="${esc(p)}"><img alt="Screenshot"></a>`).join('');
  return `<article class="report" data-id="${r.id}">
    <div class="report-head">
      <span class="tag ${esc(r.kind)}">${esc(r.kind)}</span>
      <span class="status" style="--c:${color}">${esc(label)}</span>
      <span class="meta">#${r.id} · ${esc(when(r.created_at))}</span>
      <span class="spacer"></span>
      <span class="meta">${esc(r.email || 'deleted account')}${r.platform ? ' · ' + esc(r.platform) : ''}${r.app_version ? ' ' + esc(r.app_version) : ''}</span>
    </div>
    <p class="msg">${esc(r.message)}</p>
    ${shots ? `<div class="shots">${shots}</div>` : ''}
    <div class="reply-row">
      <select class="st">${STATUSES.map(([v, l]) => `<option value="${v}" ${v === r.status ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <textarea class="rp" maxlength="1000" placeholder="Reply the pilot will see under “Your reports”">${esc(r.reply || '')}</textarea>
      <button class="btn btn-primary btn-small sv">Save</button>
    </div>
  </article>`;
}

const grow = (t) => { t.style.height = 'auto'; t.style.height = Math.max(130, t.scrollHeight + 2) + 'px'; };
function wireReport(el) {
  const id = Number(el.dataset.id);
  const ta = $('.rp', el); grow(ta); ta.addEventListener('input', () => grow(ta));
  $('.sv', el).onclick = async (e) => {
    const b = e.currentTarget; b.disabled = true;
    const status = $('.st', el).value, reply = $('.rp', el).value;
    const { error } = await sb.rpc('hub_update_feedback', { p_id: id, p_status: status, p_reply: reply });
    b.disabled = false;
    if (error) return toast(error.message);
    const r = cache.feedback.find((x) => x.id === id);
    Object.assign(r, { status, reply: reply.trim() || null, updated_at: new Date().toISOString() });
    const [, label, color] = statusOf(status);
    const s = $('.status', el); s.textContent = label; s.style.setProperty('--c', color);
    $('#n-bugs').textContent = cache.feedback.filter((x) => OPEN.has(x.status)).length;
    toast(`Report #${id} saved`);
  };
}

// Screenshots live in the private feedback-shots bucket; admins get
// short-lived signed links.
async function loadShots(root) {
  const links = [...root.querySelectorAll('[data-shot]')];
  if (!links.length) return;
  const { data, error } = await sb.storage.from('feedback-shots').createSignedUrls(links.map((a) => a.dataset.shot), 3600);
  if (error) return;
  data.forEach((d, i) => { if (d.signedUrl) { links[i].href = d.signedUrl; $('img', links[i]).src = d.signedUrl; } });
}

function people(p) {
  const pane = $('#pane');
  const added = p.android.filter((t) => t.added_to_play).length;
  pane.innerHTML = `
    <div class="grid2">
      <section class="panel">
        <h3>Admins <span class="count">${p.admins.length}</span></h3>
        <div class="sub">Can sign in here and use admin tools in the app (gift codes).</div>
        <div class="rows">${p.admins.map((a) => `
          <div class="row"><div class="main"><b>${esc(a.email)}</b><span>${a.has_account ? 'Has an account' : 'No account yet'}${a.email === me.email.toLowerCase() ? ' · you' : ''}</span></div>
          ${a.email === me.email.toLowerCase() ? '' : `<button class="btn btn-danger btn-small" data-rm-admin="${esc(a.email)}">Remove</button>`}</div>`).join('')}</div>
        <form class="add" id="add-admin"><input type="email" placeholder="Email to make admin" required><button class="btn btn-ghost btn-small">Add admin</button></form>
      </section>

      <section class="panel">
        <h3>Testers <span class="count">${p.members.length}</span></h3>
        <div class="sub">Emails let into the app before launch (iPhone, web and Windows).</div>
        <div class="rows">${p.members.map((m) => `
          <div class="row"><div class="main"><b>${esc(m.email)}</b><span>${esc(m.note || '—')} · added ${esc(day(m.added_at))}${m.last_sign_in ? ' · last in ' + esc(day(m.last_sign_in)) : ' · never signed in'}</span></div>
          <button class="btn btn-danger btn-small" data-rm-member="${esc(m.email)}">Remove</button></div>`).join('') || '<div class="muted">No testers yet.</div>'}</div>
        <form class="add" id="add-member"><input type="email" placeholder="Tester's email" required style="flex:1.4"><input type="text" placeholder="Note (optional)" maxlength="100"><button class="btn btn-ghost btn-small">Add</button></form>
      </section>

      <section class="panel">
        <h3>Android sign-ups <span class="count">${p.android.length}</span></h3>
        <div class="sub">From orvixaero.com/android. Google Play needs 12 testers opted in for 14 days. ${added} of ${p.android.length} added to Play.</div>
        <div class="progress"><i style="width:${Math.min(100, p.android.length / 12 * 100)}%"></i></div>
        <div class="rows">${p.android.map((t) => `
          <div class="row"><div class="main"><b>${esc(t.first_name ? t.first_name + ' · ' : '')}${esc(t.email)}</b><span>${esc(t.flying || '—')} · ${esc(day(t.created_at))}</span></div>
          <label class="toggle"><input type="checkbox" data-play="${esc(t.email)}" ${t.added_to_play ? 'checked' : ''}> On Play list</label></div>`).join('') || '<div class="muted">No sign-ups yet.</div>'}</div>
      </section>

      <section class="panel">
        <h3>Paywall preview <span class="count">${p.preview.length}</span></h3>
        <div class="sub">See the subscription screen before launch (App Review and purchase tests).</div>
        <div class="rows">${p.preview.map((x) => `
          <div class="row"><div class="main"><b>${esc(x.email)}</b><span>${esc(x.note || '')}</span></div><span class="badge">Preview</span></div>`).join('') || '<div class="muted">None.</div>'}</div>
      </section>
    </div>`;

  const after = async (error, msg) => {
    if (error) return toast(error.message);
    toast(msg); people(await loadPeople(true));
  };
  $('#add-admin').onsubmit = async (e) => {
    e.preventDefault(); const email = $('input', e.target).value;
    const { error } = await sb.rpc('hub_set_admin', { p_email: email, p_on: true });
    after(error, `${email} is now an admin`);
  };
  $('#add-member').onsubmit = async (e) => {
    e.preventDefault(); const [em, note] = e.target.querySelectorAll('input');
    const { error } = await sb.rpc('hub_set_member', { p_email: em.value, p_note: note.value, p_on: true });
    after(error, `${em.value} added`);
  };
  pane.querySelectorAll('[data-rm-admin]').forEach((b) => b.onclick = async () => {
    if (!confirm(`Remove ${b.dataset.rmAdmin} as admin?`)) return;
    const { error } = await sb.rpc('hub_set_admin', { p_email: b.dataset.rmAdmin, p_on: false });
    after(error, 'Admin removed');
  });
  pane.querySelectorAll('[data-rm-member]').forEach((b) => b.onclick = async () => {
    if (!confirm(`Remove ${b.dataset.rmMember}? They'll see “invite-only” in the app.`)) return;
    const { error } = await sb.rpc('hub_set_member', { p_email: b.dataset.rmMember, p_note: null, p_on: false });
    after(error, 'Tester removed');
  });
  pane.querySelectorAll('[data-play]').forEach((c) => c.onchange = async () => {
    const { error } = await sb.rpc('hub_set_android', { p_email: c.dataset.play, p_added: c.checked });
    if (error) { c.checked = !c.checked; return toast(error.message); }
    cache.people.android.find((t) => t.email === c.dataset.play).added_to_play = c.checked;
    toast(c.checked ? 'Marked as on the Play list' : 'Unmarked');
  });
}

// ---------- Orvix Grid ----------
async function grid() {
  crumb('<span>Orvix Grid</span><i>/</i><b>Overview</b>'); setNav('grid');
  $('#view').innerHTML = `
    <div class="page-title"><div style="display:flex;align-items:center;gap:14px"><img class="app-icon" src="icon-grid.png" alt="" style="width:52px;height:52px;border-radius:12px"><div><h1>Orvix Grid</h1><div class="muted">Read-only view of Orvix Grid’s own backend</div></div></div></div>
    <div id="gpane"><div class="muted">Loading…</div></div>`;
  const g = await loadGrid();
  const pane = $('#gpane'); if (!pane) return;
  if (!g.connected) {
    pane.innerHTML = `<div class="soon"><h2>Not connected yet</h2><p>${esc(g.reason || '')}</p>
      <p class="muted">The hub reads Orvix Grid through the <b>hub-grid</b> service, using Orvix Grid’s secret key saved as <b>GRID_SERVICE_KEY</b> in the Orvix Aero project’s Edge Function secrets.</p></div>`;
    return;
  }
  const tile = (icon, c, label, value, sub) => `<div class="tile" style="--c:${c}"><div class="ti">${icon}</div><div style="min-width:0"><div class="tl">${label}</div><div class="tv">${value}</div><div class="ts">${sub}</div></div></div>`;
  pane.innerHTML = `
    <div class="tiles">
      ${tile(IC.users, 'var(--blue)', 'Accounts', g.accounts.toLocaleString(), `+${g.accounts_7d} this week`)}
      ${tile(IC.active, 'var(--green)', 'Active this week', g.signed_in_7d.toLocaleString(), 'Signed in, last 7 days')}
      ${tile(IC.users, 'var(--violet)', 'Crews', g.crews, `${g.crew_members} crew members`)}
      ${tile(IC.msg, 'var(--orange)', 'Player reports', g.reports_7d, `${g.reports_total} in total`)}
    </div>
    <div class="lower" style="grid-template-columns:1.25fr 1fr">
      <section class="panel"><div class="sec" style="margin-bottom:4px"><h3>New Orvix Grid accounts</h3><span class="muted">Last 14 days</span></div><div class="chart-wrap" id="chart"></div></section>
      <section class="panel"><div class="sec" style="margin-bottom:4px"><h3>Recent activity</h3></div><div id="acts"></div></section>
    </div>
    <div class="sec" style="margin-top:28px"><h2>Player reports</h2><span class="muted">${g.upcoming_ops} upcoming crew ops</span></div>
    <div class="reports">${g.reports.length ? g.reports.map((r) => `<article class="report">
      <div class="report-head"><span class="tag other">${esc(r.what)}</span><span class="meta">${esc(r.crew)} · ${esc(when(r.created_at))}</span><span class="spacer"></span>
      <span class="meta">from ${esc(r.reporter || 'unknown')}${r.target ? ' · about ' + esc(r.target) : ''}</span></div>
      <p class="msg" style="margin:0">${esc(r.reason || 'No reason given')}</p></article>`).join('') : '<div class="empty">No player reports.</div>'}</div>
    <p class="note">Player reports flag crew comments, ops, needs or members. To act on one, use Orvix Grid’s own tools; the hub only reads.</p>`;
  drawChart($('#chart'), g.by_day);
  $('#acts').innerHTML = g.activity.length ? g.activity.map((a) => {
    const [icon, c, title] = a.kind === 'signup' ? [IC.plus, 'var(--blue)', 'New account'] : [IC.msg, 'var(--orange)', 'Player report'];
    return `<div class="act"><span class="ai" style="--c:${c}">${icon}</span><div class="at"><b>${title}</b><span>${esc(a.detail || a.who || '')}${a.detail && a.who ? ' · ' + esc(a.who) : ''}</span></div><time>${ago(a.at)}</time></div>`;
  }).join('') : '<div class="muted">Nothing yet.</div>';
}
